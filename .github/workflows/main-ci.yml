name: Main

on:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  beta:
    name: Build & Upload to TestFlight
    needs: unit-tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
